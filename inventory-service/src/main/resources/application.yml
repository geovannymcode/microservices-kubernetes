spring:
  application:
    name: service-inventory
  webflux:
    base-path: /services-inventory
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    # The contract types orderCount and stock as integer and price as number. Without this,
    # {"orderCount": 1.9} silently becomes 1 and {"orderCount": "3"} becomes 3, and stock is decreased.
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  reactor:
    # Restores the Micrometer observation (traceId/spanId in MDC) on every Reactor operator thread hop.
    context-propagation: auto
  # JDBC se utiliza únicamente para Flyway al arrancar; las operaciones de la app usan R2DBC.
  flyway:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inventory}
    # Optional DDL-capable migration user (e.g. on RDS) so the runtime user only needs DML.
    user: ${DB_MIGRATION_USER:${DB_USER:inventory}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:}}
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:}
    # Bounded waits: with the pool exhausted or MySQL unresponsive, requests fail fast (503) instead of
    # queueing forever. acquire-retry (default 1) doubles the acquire wait, so 1 s gives ~2 s worst case,
    # inside the readiness probe's 3 s timeout.
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 30m
      max-life-time: 30m
      max-acquire-time: 1s
      max-create-connection-time: 2s
      max-validation-time: 1s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        # Liveness ignores MySQL: restarting the pod does not fix a database outage.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,r2dbc
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Buckets instead of client-side percentiles: Prometheus computes p50/p95/p99 with
      # histogram_quantile() and, unlike client percentiles, they aggregate across pods.
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": 100ms,300ms,1s
  # Prometheus scrapes /actuator/prometheus; OTLP push stays off unless OTEL_METRICS_EXPORTER=otlp.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  # Logs by OTLP only where a collector exists: OTEL_LOGS_EXPORTER=otlp (Compose, Kubernetes) overrides this.
  # Locally there is none, and a failing log exporter would log its own failures.
  logging:
    export:
      otlp:
        enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
