apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-order
  labels:
    app.kubernetes.io/name: service-order
    app.kubernetes.io/component: api
    app.kubernetes.io/version: 0.0.1-SNAPSHOT
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # component=api keeps the migration Job's pod (same name label) out of the Deployment, Service and PDB.
  selector:
    matchLabels:
      app.kubernetes.io/name: service-order
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-order
        app.kubernetes.io/component: api
        app.kubernetes.io/version: 0.0.1-SNAPSHOT
        # Istio/Kiali group workloads by app + version.
        app: service-order
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /services-order/actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      serviceAccountName: service-order
      automountServiceAccountToken: false
      # preStop (5 s) + Spring graceful shutdown (20 s, spring.lifecycle.timeout-per-shutdown-phase) fit in 30 s.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service-order
          image: geovannycode/service-order:0.0.1-SNAPSHOT
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: service-order-config
            - secretRef:
                name: service-order-db
          env:
            # Same sizing as service-inventory (see its deployment): bounded heap + direct memory, and GC/JIT/Netty
            # threads pinned to the pod's CPU share instead of every node core.
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=60 -XX:MaxDirectMemorySize=96m
                -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
          # No CPU limit: CFS quotas throttle the JVM while it starts (JIT, class loading) and
          # multiply startup time; the request still drives scheduling and the HPA percentage.
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          # Up to 120 s to start (vs. ~3 s measured): a cold node or a slow first PostgreSQL connection must not
          # turn into a restart loop. Liveness and readiness only begin once this probe has passed.
          startupProbe:
            httpGet:
              path: /services-order/actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /services-order/actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readinessState + r2dbc only: an open circuit toward Inventory or Kafka being down keeps the pod Ready.
          readinessProbe:
            httpGet:
              path: /services-order/actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Lets kube-proxy/Endpoints drop the pod before Spring stops accepting requests.
            # Native sleep action (K8s >= 1.30): the distroless image has no sleep binary.
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # JVM perf data, Netty's and zstd-jni's native library extraction need a writable /tmp.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
