apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: geovannycode
resources:
  - serviceaccount.yaml
  - migration-job.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
# Only part-of is common, as in k8s/inventory/base.
labels:
  - pairs:
      app.kubernetes.io/part-of: geovannycode-shop
    includeTemplates: true
# Generated (hashed name) so a config change rolls the pods; overlays merge into it.
configMapGenerator:
  - name: service-order-config
    envs:
      - config.env
    options:
      labels:
        app.kubernetes.io/name: service-order
# The DB Secret (service-order-db: DB_USER, DB_PASSWORD) is generated by each overlay.
