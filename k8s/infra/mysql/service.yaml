# Headless: "mysql" resolves straight to the StatefulSet pod (mysql-0).
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: tcp-mysql   # Istio protocol prefix for a non-HTTP port.
      port: 3306
      targetPort: mysql
