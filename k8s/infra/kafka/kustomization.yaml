# Single-node Kafka (KRaft) for minikube / Docker Desktop only. On EKS it will be Amazon MSK or Confluent Cloud.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: geovannycode
resources:
  - service.yaml
  - statefulset.yaml
  - topics-job.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: geovannycode-shop
    includeTemplates: true
