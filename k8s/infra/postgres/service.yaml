# Headless: "postgres" resolves straight to the StatefulSet pod (postgres-0).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: tcp-postgres   # Istio protocol prefix for a non-HTTP port.
      port: 5432
      targetPort: postgres
