# Enforced only with a policy-capable CNI (e.g. minikube --cni=calico).
# No ingress resource is created in this phase. Use port-forward for local API demos.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: service-notify
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: service-notify
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8082
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mongodb
      ports:
        - protocol: TCP
          port: 27017
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - {protocol: TCP, port: 4318}
# Webhook is disabled (sender=log). If enabled, add an egress rule with the actual destination
# CIDR and port. NetworkPolicy cannot select DNS names; fine-grained HTTPS control comes with Istio Egress.
