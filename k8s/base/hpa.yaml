apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-inventory
  labels:
    app.kubernetes.io/name: service-inventory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-inventory
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
