apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-inventory
  labels:
    app.kubernetes.io/name: service-inventory
    app.kubernetes.io/component: api
    app.kubernetes.io/version: 0.0.1-SNAPSHOT
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-inventory
        app.kubernetes.io/component: api
        app.kubernetes.io/version: 0.0.1-SNAPSHOT
        # Istio/Kiali group workloads by app + version.
        app: service-inventory
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /services-inventory/actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: service-inventory
      automountServiceAccountToken: false
      # preStop (5 s) + Spring graceful shutdown (20 s, spring.lifecycle.timeout-per-shutdown-phase) fit in 30 s.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service-inventory
          image: codearti/service-inventory:0.0.1-SNAPSHOT
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: service-inventory-config
            - secretRef:
                name: service-inventory-db
          env:
            # Overrides the image default (MaxRAMPercentage=75), which was OOMKilled under load at 768Mi:
            # Netty's direct-memory ceiling defaults to the max heap, so heap + direct could reach ~1.1Gi.
            # Without a CPU limit the JVM sizes GC/JIT threads and Netty event loops/arenas for every node
            # core (12 locally, far more on EKS nodes); ActiveProcessorCount pins that to the pod's share.
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=60 -XX:MaxDirectMemorySize=96m
                -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
          # No CPU limit: CFS quotas throttle the JVM while it starts (JIT, class loading) and
          # multiply startup time; the request still drives scheduling and the HPA percentage.
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /services-inventory/actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /services-inventory/actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /services-inventory/actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Lets kube-proxy/Endpoints drop the pod before Spring stops accepting requests.
            # Native sleep action (K8s >= 1.30): the distroless image has no sleep binary.
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # JVM perf data and Netty's native library extraction need a writable /tmp.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
