apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: geovannycode
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
# Only part-of is common: the Namespace is shared with k8s/mysql, so a version label here would flip on every apply.
labels:
  - pairs:
      app.kubernetes.io/part-of: geovannycode-shop
    includeTemplates: true
# Generated (hashed name) so a config change rolls the pods; overlays merge into it.
configMapGenerator:
  - name: service-inventory-config
    envs:
      - config.env
    options:
      labels:
        app.kubernetes.io/name: service-inventory
# The DB Secret (service-inventory-db: DB_USER, DB_PASSWORD) is generated by each overlay.
