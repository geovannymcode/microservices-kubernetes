# metrics-server for clusters without a built-in addon (Docker Desktop). minikube uses "minikube addons enable metrics-server".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
patches:
  # Docker Desktop's kubelet serves a self-signed certificate. Local clusters only, never EKS.
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
