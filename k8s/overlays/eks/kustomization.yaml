# Placeholder for EKS; completed in the joint phase with Order and Notification.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Namespace geovannycode is created by the platform (GitOps/Terraform), not by this overlay.
# TODO(eks): image from ECR, e.g.
# images:
#   - name: geovannycode/service-inventory
#     newName: <account>.dkr.ecr.<region>.amazonaws.com/service-inventory
#     newTag: <git-sha>
# TODO(eks): DB_HOST -> RDS MySQL endpoint (configMapGenerator merge); no k8s/mysql on EKS.
# TODO(eks): separate users: DB_USER/DB_PASSWORD with DML only, DB_MIGRATION_USER/DB_MIGRATION_PASSWORD with DDL
#            for Flyway; TLS to RDS (sslMode=VERIFY_IDENTITY on both the JDBC and R2DBC URLs).
# TODO(eks): service-inventory-db from AWS Secrets Manager (External Secrets Operator), never a local .env.
# TODO(eks): IRSA annotation on the ServiceAccount (eks.amazonaws.com/role-arn).
# TODO(eks): bigger requests (cpu 500m / memory 512Mi, limit 1Gi), HPA min 2, and topologySpreadConstraints across zones.
# TODO(eks): OTEL_EXPORTER_OTLP_ENDPOINT -> the cluster's collector (ADOT or OpenTelemetry Operator).
# Actuator and Swagger stay off the traffic port: Ingress/API Gateway only ever reach 8080 (the API), while
# kubelet probes and Prometheus use 8081. Spring Boot reads these env vars directly (relaxed binding).
configMapGenerator:
  - name: service-inventory-config
    namespace: geovannycode
    behavior: merge
    literals:
      - MANAGEMENT_SERVER_PORT=8081
      - SPRINGDOC_API_DOCS_ENABLED=false
      - SPRINGDOC_SWAGGER_UI_ENABLED=false
patches:
  - target:
      kind: Deployment
      name: service-inventory
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value: {name: management, containerPort: 8081, protocol: TCP}
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet
        value: {path: /actuator/health/liveness, port: management}
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet
        value: {path: /actuator/health/liveness, port: management}
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet
        value: {path: /actuator/health/readiness, port: management}
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1port
        value: "8081"
      - op: replace
        path: /spec/template/metadata/annotations/prometheus.io~1path
        value: /actuator/prometheus
  # With >= 2 replicas, keep one serving during voluntary disruptions (node drains, upgrades).
  - target:
      kind: PodDisruptionBudget
      name: service-inventory
    patch: |-
      - op: remove
        path: /spec/maxUnavailable
      - op: add
        path: /spec/minAvailable
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: service-inventory
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
