# Everything for a local cluster (minikube or Docker Desktop): infrastructure, Inventory and Order.
# make k8s-up applies these parts in order (infra -> topic -> migration -> apps) and waits between them;
# this file is the whole picture for "kubectl apply -k --dry-run=server", diffs and GitOps.
# The Namespace is applied separately (k8s/namespace), so deleting this never deletes the databases.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../infra/mysql
  - ../../infra/postgres
  - ../../infra/kafka
  - ../../inventory/overlays/minikube
  - ../../order/overlays/minikube
  - ../../infra/mongodb
  - ../../notify/overlays/minikube
