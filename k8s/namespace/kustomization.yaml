# Applied on its own (make k8s-up), never from base/ or mysql/: otherwise "kubectl delete -k" on the app
# would delete the Namespace and, in cascade, the MySQL StatefulSet and its PVC. On EKS the platform owns it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
