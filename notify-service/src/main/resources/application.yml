spring:
  application:
    name: service-notify
  webflux:
    base-path: /services-notify
  lifecycle:
    timeout-per-shutdown-phase: 20s
  reactor:
    # Restores the Micrometer observation (trace.id in MDC, parent of the MongoDB and webhook spans) and the
    # eventId/orderId MDC keys on every Reactor thread hop, including the chain the listener waits for.
    context-propagation: auto
  # Boot 4 moved the connection settings from spring.data.mongodb.* (deprecated, level error) to spring.mongodb.*;
  # spring.data.mongodb.* keeps only Spring Data options (auto-index-creation, field naming...).
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DB:db_notify}
    username: ${MONGO_USER:notify}
    password: ${MONGO_PASSWORD:}
    # The application user is created in its own database, not in admin.
    authentication-database: ${MONGO_DB:db_notify}
  # Consumer only, plus a minimal producer for the dead-letter topic (KafkaConsumerConfiguration builds it).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: service-notify
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A record that is not valid JSON must reach the DLT, not loop forever in the consumer.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # Fixed type: Order publishes plain JSON (StringSerializer), never Spring type headers, and none are trusted.
        spring.json.value.default.type: com.geovannycode.notify_service.notify.domain.OrderEvent
        spring.json.use.type.headers: false
    producer:
      acks: all
      properties:
        enable.idempotence: true
    listener:
      # Offset committed after each record is processed (stored and delivered), never before.
      ack-mode: record
      concurrency: ${NOTIFY_CONSUMER_CONCURRENCY:3}
      # Consumer span per record, child of the traceparent Order's producer injected (same trace as the PUT),
      # plus the spring.kafka.listener timer.
      observation-enabled: true
    admin:
      # Topic creation (local/docker/test) must not hold startup for long when Kafka is down.
      operation-timeout: 5s
  data:
    mongodb:
      # Indexes are created explicitly by MongoIndexInitializer (reviewed in code), never derived from annotations.
      auto-index-creation: false

notify:
  topics:
    order-events: orders.events.v1
  processing-timeout: ${NOTIFY_PROCESSING_TIMEOUT:10s}
  retry:
    max-attempts: 3
    initial-interval: 1s
    multiplier: 2
    max-interval: 4s

# Validated at startup (NotificationSenderProperties): type=webhook without a URL stops the application.
notification:
  sender:
    # log (default) | webhook
    type: ${NOTIFICATION_SENDER_TYPE:log}
    webhook:
      url: ${NOTIFY_WEBHOOK_URL:}
      connect-timeout: 1s
      response-timeout: 3s
      # Optional: signs each body (X-Signature, hex HMAC-SHA256). Environment variable only, never committed.
      secret: ${NOTIFY_WEBHOOK_SECRET:}

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # mongoIndexes (MongoIndexInitializer): no traffic before the unique eventId index exists.
        # Kafka is deliberately absent: with Kafka down the query API keeps serving and the consumer reconnects
        # on its own; restarting or unrouting the pod would not bring Kafka back.
        readiness:
          include: readinessState,mongo,mongoIndexes
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[notifications.delivery]": true
        "[spring.kafka.listener]": true
  # Prometheus scrapes /actuator/prometheus; OTLP push stays off unless OTEL_METRICS_EXPORTER=otlp.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  # Logs by OTLP only where a collector exists: OTEL_LOGS_EXPORTER=otlp (Compose, Kubernetes) overrides this.
  # Locally there is none, and a failing log exporter would log its own failures.
  logging:
    export:
      otlp:
        enabled: false

# Swagger UI shows the static contract copied into the jar at build time, not a reflection-generated spec.
# springdoc needs api-docs enabled for the UI (it serves /v3/api-docs/swagger-config), so the reflection
# scan is emptied instead: there is a single API description, the contract (same as order-service).
springdoc:
  paths-to-exclude: /**
  swagger-ui:
    path: /swagger-ui.html
    url: /services-notify/openapi/services-notify.yaml
