# Each integration-test class has its own context, with its own MongoDB and Kafka containers (Testcontainers beans).
# Spring caches up to 32 contexts and keeps their containers running until the JVM exits: by the last classes a
# dozen containers competed with the rest of Docker and Kafka startups timed out. Evicted contexts are closed,
# which stops their containers.
spring.test.context.cache.maxSize=2
