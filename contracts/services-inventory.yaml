openapi: 3.1.0
info:
  title: Inventory Service
  version: 2.0.0
  description: >-
    Contrato del inventario reactivo. idProduct y productId identifican products.code
    (solo mayúsculas, números y guiones); la clave interna products.id nunca se expone.
    PUT descuenta unidades: envía Idempotency-Key para que los reintentos sean seguros;
    sin ella no debe reintentarse automáticamente tras una respuesta incierta.
servers:
  - url: /services-inventory
    description: Prefijo del servicio
security: []
tags:
  - name: Inventories
    description: Consulta, creación y descuento atómico de existencias.
paths:
  /inventories:
    get:
      tags: [Inventories]
      operationId: listInventories
      summary: Listar productos ordenados por código
      description: >-
        Paginado por page/size en las tres representaciones (JSON, NDJSON y SSE). Para recorrer el
        catálogo completo, pide páginas sucesivas hasta recibir menos de size elementos.
      parameters:
        - name: page
          in: query
          required: false
          description: Número de página, empezando en 0.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Elementos por página.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: delayMs
          in: query
          required: false
          description: Parámetro de demostración; demora no bloqueante entre productos, en milisegundos.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 2000
            default: 0
          example: 500
      responses:
        '200':
          description: Productos ordenados por idProduct ascendente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryResponse'
              examples:
                products:
                  value:
                    - idProduct: AC-1550
                      nameProduct: Lentes
                      price: 123.50
                      stock: 50
            application/x-ndjson:
              schema:
                type: string
                description: Cada línea es un objeto InventoryResponse independiente.
              examples:
                products:
                  value: |
                    {"idProduct":"AC-1550","nameProduct":"Lentes","price":123.50,"stock":50}
                    {"idProduct":"AC-1551","nameProduct":"Teclado","price":89.90,"stock":30}
            text/event-stream:
              schema:
                type: string
                description: Eventos SSE "inventory" con id igual al código del producto; data contiene un InventoryResponse.
              examples:
                products:
                  value: |
                    id: AC-1550
                    event: inventory
                    data: {"idProduct":"AC-1550","nameProduct":"Lentes","price":123.50,"stock":50}

                    id: AC-1551
                    event: inventory
                    data: {"idProduct":"AC-1551","nameProduct":"Teclado","price":89.90,"stock":30}

        '400':
          description: delayMs fuera de 0..2000, page negativo o size fuera de 1..100.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                invalidDelay:
                  value:
                    type: https://codearti.com/problems/validation-error
                    title: Solicitud inválida
                    status: 400
                    detail: Los datos de entrada no son válidos.
                    instance: /services-inventory/inventories
                    timestamp: '2026-10-02T15:00:00Z'
                    errors:
                      - field: delayMs
                        message: La demora debe estar entre 0 y 2000 ms.
    post:
      tags: [Inventories]
      operationId: createInventory
      summary: Crear un producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryRequest'
            examples:
              product:
                value:
                  idProduct: PRD-1001
                  nameProduct: Lentes
                  price: 123.50
                  stock: 50
      responses:
        '201':
          description: Producto creado.
          headers:
            Location:
              description: URI del producto creado, incluido el prefijo del servicio.
              required: true
              schema:
                type: string
                format: uri-reference
              example: /services-inventory/inventories/PRD-1001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
              examples:
                created:
                  value:
                    idProduct: PRD-1001
                    nameProduct: Lentes
                    price: 123.50
                    stock: 50
        '400':
          description: Datos de entrada inválidos o JSON mal formado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                invalidStock:
                  value:
                    type: https://codearti.com/problems/validation-error
                    title: Solicitud inválida
                    status: 400
                    detail: Los datos de entrada no son válidos.
                    instance: /services-inventory/inventories
                    timestamp: '2026-10-02T15:00:00Z'
                    errors:
                      - field: stock
                        message: El stock debe ser como mínimo 1.
        '409':
          description: Ya existe un producto con el código solicitado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                duplicate:
                  value:
                    type: https://codearti.com/problems/duplicate-product
                    title: Producto duplicado
                    status: 409
                    detail: Ya existe un producto con código PRD-1001.
                    instance: /services-inventory/inventories
                    timestamp: '2026-10-02T15:00:00Z'
  /inventories/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        description: Código público del producto; corresponde a products.code.
        schema:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Z0-9-]{1,50}$'
        example: AC-1550
    get:
      tags: [Inventories]
      operationId: getInventory
      summary: Consultar un producto por código
      responses:
        '200':
          description: Producto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
              examples:
                product:
                  value:
                    idProduct: AC-1550
                    nameProduct: Lentes
                    price: 123.50
                    stock: 50
        '400':
          $ref: '#/components/responses/InvalidProductId'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    put:
      tags: [Inventories]
      operationId: decreaseInventory
      summary: Descontar existencias de forma atómica
      description: >-
        Descuenta orderCount unidades y devuelve el producto actualizado. Con Idempotency-Key, un reintento
        con la misma clave y el mismo cuerpo no vuelve a descontar: responde 200 con el estado actual del
        producto. Solo se registran los descuentos aplicados; un 404 o 409 puede reintentarse con la misma clave.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Clave única por pedido (por ejemplo, el id de la orden o un UUID). Recomendada para clientes con reintentos.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]{1,64}$'
          example: order-7f3c2a90
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInvRequest'
            examples:
              order:
                value:
                  orderCount: 2
      responses:
        '200':
          description: Stock descontado; representación actualizada del producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
              examples:
                updated:
                  value:
                    idProduct: AC-1550
                    nameProduct: Lentes
                    price: 123.50
                    stock: 48
        '400':
          description: productId, orderCount o JSON inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                invalidOrderCount:
                  value:
                    type: https://codearti.com/problems/validation-error
                    title: Solicitud inválida
                    status: 400
                    detail: Los datos de entrada no son válidos.
                    instance: /services-inventory/inventories/AC-1550
                    timestamp: '2026-10-02T15:00:00Z'
                    errors:
                      - field: orderCount
                        message: La cantidad solicitada no puede superar 5.
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: El producto existe, pero no tiene stock suficiente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                insufficientStock:
                  value:
                    type: https://codearti.com/problems/insufficient-stock
                    title: Stock insuficiente
                    status: 409
                    detail: 'Stock insuficiente para el producto AC-1550: cantidad solicitada 2.'
                    instance: /services-inventory/inventories/AC-1550
                    timestamp: '2026-10-02T15:00:00Z'
        '422':
          description: La Idempotency-Key ya se usó con otro producto u otra cantidad.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                idempotencyKeyReused:
                  value:
                    type: https://codearti.com/problems/idempotency-key-reused
                    title: Clave de idempotencia reutilizada
                    status: 422
                    detail: La clave order-7f3c2a90 ya se usó con otra solicitud.
                    instance: /services-inventory/inventories/AC-1550
                    timestamp: '2026-10-02T15:00:00Z'
components:
  schemas:
    InventoryRequest:
      type: object
      required: [idProduct, nameProduct, price, stock]
      properties:
        idProduct:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Z0-9-]{1,50}$'
        nameProduct:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          description: Nombre con al menos un carácter que no sea un espacio en blanco.
        price:
          type: number
          exclusiveMinimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
          description: Importe positivo con hasta ocho dígitos enteros y dos decimales.
        stock:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
    InventoryResponse:
      type: object
      required: [idProduct, nameProduct, price, stock]
      properties:
        idProduct:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Z0-9-]{1,50}$'
        nameProduct:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
        price:
          type: number
          exclusiveMinimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 500
    OrderInvRequest:
      type: object
      required: [orderCount]
      properties:
        orderCount:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
    ProblemDetail:
      type: object
      description: Problema HTTP RFC 9457 con extensiones de validación y fecha UTC.
      required: [type, title, status, detail, instance, timestamp]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          description: Errores por campo; presente cuando hay errores de validación.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        timestamp:
          type: string
          format: date-time
  responses:
    ProductNotFound:
      description: No existe un producto con el código solicitado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            missing:
              value:
                type: https://codearti.com/problems/product-not-found
                title: Producto no encontrado
                status: 404
                detail: No se encontró el producto con código AC-1550.
                instance: /services-inventory/inventories/AC-1550
                timestamp: '2026-10-02T15:00:00Z'
    InvalidProductId:
      description: El código del producto no tiene el formato requerido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            invalidCode:
              value:
                type: https://codearti.com/problems/validation-error
                title: Solicitud inválida
                status: 400
                detail: Los datos de entrada no son válidos.
                instance: /services-inventory/inventories/AC_1550
                timestamp: '2026-10-02T15:00:00Z'
                errors:
                  - field: productId
                    message: El código solo puede contener letras mayúsculas, números y guiones, entre 1 y 50 caracteres.
