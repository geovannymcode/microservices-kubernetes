openapi: 3.0.3
info:
  title: Servicio de Órdenes
  description: API para gestionar órdenes en un sistema de comercio. Al confirmar una orden se descuenta el inventario en Inventory Service.
  version: 1.1.0

servers:
  - url: /services-order
    description: Url endpoint del servicio de órdenes

# La API del curso no tiene autenticación propia: la protege el API Gateway.
security: []

tags:
  - name: Orders
    description: Operaciones relacionadas con las órdenes

paths:
  /orders:
    get:
      tags:
        - Orders
      summary: Listar todas las órdenes
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra por estado de la orden
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Lista de órdenes recuperada exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/OrderResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Orders
      summary: Registrar una nueva orden
      description: Crea la orden en estado pending. No descuenta inventario.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              codeProduct: AC-1550
              quantity: 2
      responses:
        '201':
          description: Orden registrada exitosamente
          headers:
            Location:
              description: URL de la orden creada
              schema:
                type: string
                example: /services-order/orders/12345
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        description: ID de la orden
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Orders
      summary: Obtener una orden específica
      operationId: getOrder
      responses:
        '200':
          description: Detalles de la orden recuperados exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Orders
      summary: Confirmar una orden
      description: >
        Descuenta el inventario del producto y completa la orden.
        Es idempotente: confirmar una orden ya completada devuelve 200 sin volver a descontar.
        Si el inventario rechaza (producto inexistente o stock insuficiente) la orden queda canceled y responde 409.
        Si el inventario no está disponible la orden sigue pending y responde 503.
      operationId: updateOrder
      responses:
        '200':
          description: Orden completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La orden está cancelada o el inventario la rechazó
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://codearti.com/problems/order-rejected
                title: Orden rechazada
                status: 409
                detail: Stock insuficiente para el producto AC-1550
                instance: /services-order/orders/12345
                reason: INSUFFICIENT_STOCK
                timestamp: '2026-10-03T19:00:00Z'
        '503':
          description: El servicio de inventario no está disponible; la orden sigue pending
          headers:
            Retry-After:
              description: Segundos sugeridos antes de reintentar
              schema:
                type: integer
                example: 30
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://codearti.com/problems/validation-error
            title: Solicitud inválida
            status: 400
            detail: La solicitud tiene campos inválidos
            instance: /services-order/orders
            errors:
              - field: codeProduct
                message: no debe estar vacío
            timestamp: '2026-10-03T19:00:00Z'
    NotFound:
      description: Orden no encontrada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://codearti.com/problems/order-not-found
            title: Orden no encontrada
            status: 404
            detail: No existe la orden 999999
            instance: /services-order/orders/999999
            timestamp: '2026-10-03T19:00:00Z'
    InternalError:
      description: Error en el servidor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    OrderStatus:
      type: string
      enum:
        - pending
        - completed
        - canceled
      example: pending

    OrderRequest:
      type: object
      required:
        - codeProduct
      properties:
        codeProduct:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Za-z0-9-]{1,50}$'
          example: AC-1550
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          default: 1
          example: 2

    OrderResponse:
      type: object
      required:
        - id
        - codeProduct
        - quantity
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        codeProduct:
          type: string
          example: AC-1550
        quantity:
          type: integer
          format: int32
          example: 2
        status:
          $ref: '#/components/schemas/OrderStatus'
        cancelReason:
          type: string
          description: Solo presente cuando status es canceled
          enum:
            - PRODUCT_NOT_FOUND
            - INSUFFICIENT_STOCK
        createdAt:
          type: string
          format: date-time
          example: '2026-10-03T19:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-03T19:00:05Z'

    ProblemDetail:
      type: object
      description: Error en formato RFC 9457
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        reason:
          type: string
          description: Motivo de negocio (solo en 409)
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
