# grafana/otel-lgtm 0.35.0 default config (OTLP receiver settings) plus scrape jobs for the course services.
# Mounted over /otel-lgtm/prometheus.yaml by docker-compose (profile observability).
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m
# Same model as Kubernetes: Prometheus pulls /actuator/prometheus from each service by its Compose name, on the
# shared network (never host.docker.internal: a service run on the host with spring-boot:run is not scraped).
# 5s so the dashboards show short windows such as the circuit breaker's HALF_OPEN state.
scrape_configs:
  - job_name: service-inventory
    scrape_interval: 5s
    metrics_path: /services-inventory/actuator/prometheus
    static_configs:
      - targets: ["service-inventory:8080"]
  - job_name: service-order
    scrape_interval: 5s
    metrics_path: /services-order/actuator/prometheus
    static_configs:
      - targets: ["service-order:8081"]
  - job_name: service-notify
    scrape_interval: 5s
    metrics_path: /services-notify/actuator/prometheus
    static_configs:
      - targets: ["service-notify:8082"]
  # Consumer group lag from the broker (kafka_consumergroup_lag), also while the consumer is down.
  - job_name: kafka-exporter
    scrape_interval: 5s
    static_configs:
      - targets: ["kafka-exporter:9308"]
