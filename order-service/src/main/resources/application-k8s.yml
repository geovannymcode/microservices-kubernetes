# DB_*, INVENTORY_BASE_URL and KAFKA_BOOTSTRAP_SERVERS come from the ConfigMap and the Secret
# (application.yml resolves them). Readiness includes r2dbc only (application.yml).
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        version: @project.version@
        environment: k8s
    json:
      # ECS names for the Micrometer MDC keys so Kibana/Loki correlate logs with Jaeger/Tempo traces.
      rename:
        traceId: trace.id
        spanId: span.id
