databaseChangeLog:
  - changeSet:
      id: 001-create-table-order-shop
      author: geovannycode
      comment: Tabla de órdenes; version habilita el bloqueo optimista.
      changes:
        - createTable:
            tableName: order_shop
            remarks: Órdenes de compra de un producto del inventario
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_shop
                    nullable: false
              - column:
                  name: code_product
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: status_order
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: cancel_reason
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: order_shop

  - changeSet:
      id: 001-add-checks-order-shop
      author: geovannycode
      comment: Reglas de negocio en la BD (cantidad 1..5 y estados válidos); Liquibase open source no tiene un change type para CHECK.
      changes:
        - sql:
            sql: >-
              ALTER TABLE order_shop ADD CONSTRAINT ck_order_shop_quantity CHECK (quantity BETWEEN 1 AND 5);
              ALTER TABLE order_shop ADD CONSTRAINT ck_order_shop_status
              CHECK (status_order IN ('pending', 'completed', 'canceled'));
      rollback:
        - sql:
            sql: >-
              ALTER TABLE order_shop DROP CONSTRAINT ck_order_shop_status;
              ALTER TABLE order_shop DROP CONSTRAINT ck_order_shop_quantity;

  - changeSet:
      id: 001-create-index-order-shop-status
      author: geovannycode
      comment: Índice para listar órdenes por estado.
      changes:
        - createIndex:
            tableName: order_shop
            indexName: idx_order_shop_status_order
            columns:
              - column:
                  name: status_order
      rollback:
        - dropIndex:
            tableName: order_shop
            indexName: idx_order_shop_status_order
