spring:
  application:
    name: service-order
  webflux:
    base-path: /services-order
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Liquibase only speaks JDBC, so it gets its own blocking connection that is used once at startup to
  # migrate the schema and then closed; all runtime access goes through the reactive R2DBC pool below.
  liquibase:
    change-log: classpath:db/changelog/master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:local}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
    user: ${DB_USER:order}
    password: ${DB_PASSWORD:}
  reactor:
    # Restores the Micrometer observation (traceId/spanId in MDC) on every Reactor operator thread hop.
    context-propagation: auto
  jackson:
    # Same strictness as Inventory: {"quantity": 1.9} or {"quantity": "2"} are 400, never silently coerced.
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
    username: ${DB_USER:order}
    password: ${DB_PASSWORD:}
    pool:
      initial-size: 2
      max-size: 10
  # Producer only (Notification consumes). The value is the JSON envelope serialized with Jackson 3 when it was
  # written to the outbox (payload JSONB), so it travels as a String without a second serialization.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      compression-type: zstd
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
        # A failed send must give up well before the next cycles pile up; the event simply stays pending.
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 5000
    template:
      # Producer span per send; it injects traceparent into the record headers for Notification.
      observation-enabled: true
    admin:
      # Topic creation (local/docker/test) must not hold startup for long when Kafka is down: Order keeps
      # working and the outbox waits.
      operation-timeout: 5s

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Resilience4j endpoints are read-only views of the inventory instance (state, events, permits).
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents,retries,ratelimiters
  endpoint:
    health:
      show-details: when-authorized
      # Component statuses (not details) are public, so circuitBreakers shows CLOSED/OPEN as information.
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # Database only: an open circuit toward Inventory or Kafka being down must not take Order out of
        # rotation (confirmations answer 503 fast, events wait in the outbox). Restarting would not fix either.
        readiness:
          include: readinessState,r2dbc
        # /actuator/health/resilience: the circuit toward Inventory with its details (state, failure rate),
        # without making every other component's details public. Informational only, never a probe.
        resilience:
          include: circuitBreakers
          show-details: always
  health:
    # Shows the inventory circuit in /actuator/health; allowHealthIndicatorToFail=false keeps an Inventory
    # outage from marking Order itself as DOWN (probes are unaffected either way).
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Buckets instead of client-side percentiles: Prometheus computes p50/p95/p99 with
      # histogram_quantile() and, unlike client percentiles, they aggregate across pods.
      percentiles-histogram:
        "[http.server.requests]": true
        "[http.client.requests]": true
      slo:
        "[http.server.requests]": 100ms,300ms,1s
  # Prometheus scrapes /actuator/prometheus; OTLP push stays off unless OTEL_METRICS_EXPORTER=otlp.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  # Logs by OTLP only where a collector exists: OTEL_LOGS_EXPORTER=otlp (Compose, Kubernetes) overrides this.
  # Locally there is none, and a failing log exporter would log its own failures.
  logging:
    export:
      otlp:
        enabled: false

outbox:
  topic: orders.events.v1
  poll-interval: ${OUTBOX_POLL_INTERVAL:1s}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  retention: ${OUTBOX_RETENTION:7d}
  cleanup-interval: 1h

inventory:
  client:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8080/services-inventory}
    connect-timeout: 1s
    response-timeout: 2s

# Instance "inventory" (InventoryGateway). Applied inside-out: time limiter -> rate limiter -> circuit breaker -> retry.
resilience4j:
  timelimiter:
    instances:
      inventory:
        timeout-duration: 2s
  retry:
    instances:
      inventory:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        # Only technical failures. 4xx never get here as WebClientResponseException: the gateway turns
        # them into InventoryRejectedException or IllegalStateException first, so this means 5xx.
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException
        ignore-exceptions:
          - com.geovannycode.order.order.domain.InventoryRejectedException
          - java.lang.IllegalStateException
  circuitbreaker:
    instances:
      inventory:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: ${INVENTORY_CB_WAIT:30s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        allow-health-indicator-to-fail: false
        ignore-exceptions:
          - com.geovannycode.order.order.domain.InventoryRejectedException
  ratelimiter:
    instances:
      inventory:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0

# Swagger UI shows the static contract copied into the jar at build time, not a reflection-generated spec.
# springdoc needs api-docs enabled for the UI (it serves /v3/api-docs/swagger-config), so the reflection
# scan is emptied instead: there is a single API description, the contract.
springdoc:
  paths-to-exclude: /**
  swagger-ui:
    path: /swagger-ui.html
    url: /services-order/openapi/services-order.yaml
