services:
  mysql:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    container_name: inventory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-inventory}
      MYSQL_USER: ${DB_USER:-inventory}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h localhost -u root --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - inventory

  service-inventory:
    build:
      context: ./inventory-service
      additional_contexts:
        contracts: ./contracts
    image: codearti/service-inventory:${INVENTORY_IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: service-inventory
    depends_on:
      mysql:
        condition: service_healthy
    # DB_HOST and DB_PORT are not passed: .env holds the host-side values; inside the network it is mysql:3306.
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME:-inventory}
      DB_USER: ${DB_USER:-inventory}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      TRACING_SAMPLING: ${TRACING_SAMPLING:-1.0}
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8080}:8080"
    # The distroless image has no shell, curl or wget: a 1 KB Java class performs the HTTP check.
    healthcheck:
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xmx16m", "-cp", "/app/healthcheck",
             "HealthCheck", "http://localhost:8080/services-inventory/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - inventory

  # Grafana + Loki + Tempo + Prometheus + OpenTelemetry Collector in one image (course setup).
  # docker compose --profile observability up -d  ->  Grafana at http://localhost:3000
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
    container_name: inventory-otel-lgtm
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks:
      - inventory

volumes:
  mysql-data:

networks:
  inventory:
    driver: bridge
