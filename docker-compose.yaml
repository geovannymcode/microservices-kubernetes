services:
  mysql:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    container_name: inventory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-inventory}
      MYSQL_USER: ${DB_USER:-inventory}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h localhost -u root --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - inventory

  # Order Service database. POSTGRES_DB creates the database; Liquibase (in the app) creates the tables.
  postgresql:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    container_name: order-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderdb}
      POSTGRES_USER: ${POSTGRES_USER:-order}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - inventory

  # Order events broker: single-node KRaft (broker + controller, no ZooKeeper). Two listeners: EXTERNAL for
  # apps on the host (localhost:9092) and INTERNAL for containers on the network (kafka:19092).
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: order-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared (NewTopic in Order), never created by a typo in a producer or consumer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - inventory

  # Web UI for topics and messages: docker compose --profile tools up -d kafka-ui -> http://localhost:8085
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    container_name: order-kafka-ui
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8085}:8080"
    networks:
      - inventory

  # Liquibase CLI over the app's changelog, without installing it: docker compose run --rm liquibase status
  liquibase:
    build: ./order-service/liquibase-env
    image: geovannycode/liquibase-postgresql:5.0.3
    profiles: ["tools"]
    depends_on:
      postgresql:
        condition: service_healthy
    # Bypasses the image entrypoint, which forces its own defaults file instead of liquibase.properties.
    entrypoint: ["/liquibase/liquibase", "--defaults-file=liquibase.properties"]
    working_dir: /workspace/liquibase-env
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB:-orderdb}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-order}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      # Same default context as the app (spring.liquibase.contexts); --contexts on the command line overrides it.
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_CONTEXTS:-local}
      LIQUIBASE_ANALYTICS_ENABLED: "false"
    volumes:
      - ./order-service/liquibase-env/liquibase.properties:/workspace/liquibase-env/liquibase.properties:ro
      - ./order-service/src/main/resources:/workspace/src/main/resources:ro
    networks:
      - inventory

  service-inventory:
    build:
      context: ./inventory-service
      additional_contexts:
        contracts: ./contracts
    image: geovannycode/service-inventory:${INVENTORY_IMAGE_TAG:-0.0.1-SNAPSHOT}
    container_name: service-inventory
    depends_on:
      mysql:
        condition: service_healthy
    # DB_HOST and DB_PORT are not passed: .env holds the host-side values; inside the network it is mysql:3306.
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME:-inventory}
      DB_USER: ${DB_USER:-inventory}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      TRACING_SAMPLING: ${TRACING_SAMPLING:-1.0}
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8080}:8080"
    # The distroless image has no shell, curl or wget: a 1.5 KB Java class performs the HTTP check.
    healthcheck:
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xmx16m", "-cp", "/app/healthcheck",
             "HealthCheck", "http://localhost:8080/services-inventory/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - inventory

  # Grafana + Loki + Tempo + Prometheus + OpenTelemetry Collector in one image (course setup).
  # docker compose --profile observability up -d  ->  Grafana at http://localhost:3000
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
    container_name: inventory-otel-lgtm
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    # Prometheus scrapes Order (on the host) and Inventory every 5s; Grafana provisions the course dashboards.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/geovannycode.yaml:ro
      - ./observability/dashboards:/otel-lgtm/geovannycode-dashboards:ro
    networks:
      - inventory

volumes:
  mysql-data:
  postgres-data:
  kafka-data:

networks:
  inventory:
    driver: bridge
